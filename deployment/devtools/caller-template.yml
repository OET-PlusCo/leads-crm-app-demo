# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to .github/workflows/code_review.yml in any repo.
# Prerequisite: run the one-time submodule setup below first.
#
# ONE-TIME SETUP per repo:
#   git submodule add https://github.com/OET-PlusCo/devtools .devtools
#   git add .gitmodules .devtools
#   git commit -m "chore: add devtools submodule for code review"
#   git push
#
# TO UPDATE the agent/skills across all repos:
#   # In devtools repo: push changes to main
#   # In each target repo:
#   git submodule update --remote .devtools
#   git add .devtools && git commit -m "chore: update devtools"
# ─────────────────────────────────────────────────────────────────────────────

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      - name: Install git and Node.js
        run: |
          apt-get update && apt-get install -y git curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true   # initialises .devtools automatically

      - name: Run type check and tests
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          npm ci --prefer-offline 2>&1 | tail -5
          echo "## Type & Test Results" > test_results.txt
          if npm run lint 2>&1 | tee -a test_results.txt; then
            echo "TYPE_CHECK_STATUS=passed" >> $GITHUB_ENV
          else
            echo "TYPE_CHECK_STATUS=failed" >> $GITHUB_ENV
          fi
          # Uncomment for test runner:
          # npm test -- --reporter=verbose 2>&1 | tee -a test_results.txt || echo "TEST_STATUS=failed" >> $GITHUB_ENV
        continue-on-error: true

      - name: Run security review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE_REVIEW_MODEL: ${{ secrets.CODE_REVIEW_MODEL }}
          TEST_RESULTS_FILE: test_results.txt
          TYPE_CHECK_STATUS: ${{ env.TYPE_CHECK_STATUS }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          uv run --project .devtools/code_review_agent .devtools/code_review_agent/review_agent.py .

      - name: Post findings as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('code_review.md', 'utf8');
            } catch (e) {
              body = '## 🤖 AI Code Security & Quality Review\n\n⚠️ Review agent did not produce a report. Check the workflow logs for details.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

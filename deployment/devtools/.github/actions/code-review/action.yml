name: AI Code Security & Quality Review
description: >
  Runs the PlusCompany AI code review agent against a PR diff.
  Selects skills dynamically based on changed file types, checks for
  regressions via type-check/tests, and posts structured findings as a PR comment.

inputs:
  gemini_api_key:
    description: Gemini API key for the review agent
    required: true
  code_review_model:
    description: >
      Gemini model to use for the review (e.g. gemini-3.8-flash).
      Defaults to gemini-3.8-flash if not set. Update via the
      CODE_REVIEW_MODEL org secret to change the model across all repos at once.
    required: false
    default: ''
  node_version:
    description: Node.js version for type checking
    required: false
    default: '20'
  run_typecheck:
    description: Whether to run npm type-check before review (true/false)
    required: false
    default: 'true'
  test_command:
    description: Custom test command to run before review (e.g. "npm test")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Node.js
      if: inputs.run_typecheck == 'true' || inputs.test_command != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm

    - name: Run type check and tests
      if: inputs.run_typecheck == 'true' || inputs.test_command != ''
      shell: bash
      run: |
        echo "## Type & Test Results" > test_results.txt
        echo "Commit: ${{ github.sha }}" >> test_results.txt
        echo "Branch: ${{ github.head_ref }}" >> test_results.txt
        echo "" >> test_results.txt

        npm ci --prefer-offline 2>&1 | tail -5

        if npm run lint 2>&1 | tee -a test_results.txt; then
          echo "TYPE_CHECK_STATUS=passed" >> $GITHUB_ENV
          echo "✅ TypeScript type check: PASSED" >> test_results.txt
        else
          echo "TYPE_CHECK_STATUS=failed" >> $GITHUB_ENV
          echo "❌ TypeScript type check: FAILED" >> test_results.txt
        fi

        if [ -n "${{ inputs.test_command }}" ]; then
          if ${{ inputs.test_command }} 2>&1 | tee -a test_results.txt; then
            echo "TEST_STATUS=passed" >> $GITHUB_ENV
            echo "✅ Tests: PASSED" >> test_results.txt
          else
            echo "TEST_STATUS=failed" >> $GITHUB_ENV
            echo "❌ Tests: FAILED" >> test_results.txt
          fi
        fi
      continue-on-error: true

    - name: Checkout devtools (agent + skills)
      uses: actions/checkout@v4
      with:
        repository: OET-PlusCo/devtools
        path: .devtools
        token: ${{ github.token }}

    - name: Run review agent
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        CODE_REVIEW_MODEL: ${{ inputs.code_review_model }}
        TEST_RESULTS_FILE: test_results.txt
        TYPE_CHECK_STATUS: ${{ env.TYPE_CHECK_STATUS }}
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE
        uv run --project .devtools/code_review_agent .devtools/code_review_agent/review_agent.py .

    - name: Post findings as PR comment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body;
          try {
            body = fs.readFileSync('code_review.md', 'utf8');
          } catch (e) {
            body = '## 🤖 AI Code Security & Quality Review\n\n⚠️ Review agent did not produce a report. Check the workflow logs for details.';
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: body
          });

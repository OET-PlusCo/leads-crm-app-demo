# AI Code Review — caller workflow
# Deployed to all OET-PlusCo repos by rollout script.
# Do not edit per-repo — update devtools/.github/workflows/code-review.yml instead.

name: AI Code Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - staging
    types: [opened, synchronize, reopened]

jobs:
  review:
    uses: OET-PlusCo/devtools/.github/workflows/code-review.yml@main
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}

# AI Code Review — self-contained workflow
# Deployed to all OET-PlusCo repos by rollout script.
# To update agent logic, push changes to OET-PlusCo/devtools — this workflow
# always checks out devtools@main at runtime so updates propagate automatically.

name: AI Code Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - staging
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout devtools
        uses: actions/checkout@v4
        with:
          repository: OET-PlusCo/devtools
          path: devtools
          ref: main
          token: ${{ secrets.DEVTOOLS_TOKEN }}

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Fetch base branch for diff
        run: git -C repo fetch origin main --depth=50

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run review agent
        run: |
          uv run --project devtools/code_review_agent \
            devtools/code_review_agent/review_agent.py repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION || 'global' }}
          CODE_REVIEW_MODEL: gemini-3.8-flash

      - name: Post review as PR comment
        if: always() && hashFiles('code_review.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('code_review.md', 'utf8');
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
              event: 'COMMENT'
            });
